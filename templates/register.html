<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja - System Kartoteki Medycznej</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Rejestracja</h3>
                    </div>
                    <div class="card-body">
                        <form id="register-form">
                            <div class="mb-3">
                                <label for="username" class="form-label">Nazwa użytkownika</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Hasło</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="firstname" class="form-label">Imię</label>
                                <input type="text" class="form-control" id="firstname" required>
                            </div>
                            <div class="mb-3">
                                <label for="lastname" class="form-label">Nazwisko</label>
                                <input type="text" class="form-control" id="lastname" required>
                            </div>
                            <div class="mb-3">
                                <label for="pesel" class="form-label">PESEL</label>
                                <input type="text" class="form-control" id="pesel" maxlength="11" required>
                            </div>
                            <div class="mb-3">
                                <label for="birth_date" class="form-label">Data urodzenia</label>
                                <input type="date" class="form-control" id="birth_date" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Telefon</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Zarejestruj</button>
                                <a href="{{ url_for('login') }}" class="btn btn-outline-primary">Masz już konto? Zaloguj się</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            firstname: document.getElementById('firstname').value,
            lastname: document.getElementById('lastname').value,
            pesel: document.getElementById('pesel').value,
            birth_date: document.getElementById('birth_date').value,
            phone: document.getElementById('phone').value
        };

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });

            const data = await response.json();
            
            if (response.ok) {
                alert('Rejestracja udana');
                window.location.href = '/login';
            } else {
                alert(data.error || 'Wystąpił błąd podczas rejestracji');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Wystąpił błąd podczas rejestracji');
        }
    });
    </script>
</body>
</html>
